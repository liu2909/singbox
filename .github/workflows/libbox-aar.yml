name: Build libbox AAR

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: ~1.25.10

jobs:
  build:
    name: Build libbox AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: true

      - name: Setup OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install gomobile
        run: |
          make lib_install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize gomobile
        run: gomobile init
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build libbox
        run: make lib_android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Verify AAR outputs
        run: |
          test -f libbox.aar
          test -f libbox-legacy.aar
          ls -lh libbox*.aar

      - name: Upload libbox AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            libbox.aar
            libbox-legacy.aar
          if-no-files-found: error
